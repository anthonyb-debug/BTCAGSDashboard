<script>
/* =====================================================================
 * DEPLOYMENT CONFIGURATION — same layout as the other AGS hubs.
 * The Call Report is read from the Google Sheet's public feed, so the
 * sheet must be shared "Anyone with the link → Viewer". No API key.
 *
 *   SHEET_ID        The long ID between /d/ and /edit in the sheet URL
 *   REPORT_TAB      Tab with one row per agent per day (row 1 = headers)
 *   COLUMN_PINS     Column letters that always win. Any column not pinned
 *                   is found by its header name in row 1 (Date, User name,
 *                   Login time, Session time, Online, Talk time, Hold time,
 *                   Wrap-up total, Offered calls, Inbound/Outbound calls and
 *                   minutes, Missed dials). Times can be seconds or h:mm:ss.
 *   SHIFT_TAB       Tab with each agent's shift per month (A Month,
 *                   B Username, J EST shift). Leave '' to turn shifts off.
 *                   Agents not found there take their shift from the Roster.
 *   ROSTER_TAB      Tab with A Agent, B Hire Date, C–I Monday–Sunday schedule.
 *   Targets         AHT, answer rate, the work time expected per day and
 *                   how a short day is judged; MAX_LOGIN_SEC for data checks.
 * ===================================================================== */
window.AGS_CONFIG = {
  CLIENT_NAME: 'Banyan Treatment Center',
  SHEET_ID: '1Fhstp9OQUVwp1zUGuUjkPNIrXqNT9YNW-_ORk237HbM',
  REPORT_TAB: 'Daily Call Report',
  COLUMN_PINS: { date: 'A', name: 'C', inbound: 'AR', inTime: 'AT', outbound: 'AS', outTime: 'AU', talk: 'AV', hold: 'AX', ahtSheet: 'AY' },  // ahtSheet = AHT, read as is
  SHIFT_TAB: 'Consolidated',
  SHIFT_COLS: { month: 'A', name: 'B', shift: 'H' },
  // Roster tab: A Agent, B Hire Date, C–I Monday–Sunday ("9am-6pm", "12am-9am" or "Rest Day")
  ROSTER_TAB: 'Roster',
  SCHEDULE_TIMEZONE: 'America/New_York',  // schedules are in EST; decides which day is "today"
  NEW_HIRE_DAYS: 90,                      // hired within this many days = new hire
  AHT_TARGET_SEC: 2 * 60,             // 2:00
  ANSWER_RATE_TARGET: 0.9,            // 90%
  // the "short" rule
  ACCEPTABLE_TIME_SEC: 7.5 * 3600,    // 7:30:00 of work time a day (session + wrap-up, + meetings)
  COUNT_MEETINGS_AS_WORK: true,       // meetings, coaching and training count as work time
  SHORT_GRACE_SEC: 5 * 60,            // a day is short only when under by more than 5 minutes
  PARTIAL_DAY_LOGIN_SEC: 5 * 3600,    // login under 5:00:00 = partial day, judged against half the target
  BREAK_ALLOWANCE_SEC: 1.5 * 3600,    // lunch + breaks allowed a day; used to explain why a day was short
  // data checks
  MAX_LOGIN_SEC: 14 * 3600,           // a login longer than this is flagged (likely never logged out)
  REFRESH_SECONDS: 120,
  AGENT_PHOTOS: {
    'Alexandra Bugto':     'https://lh3.googleusercontent.com/d/1rlrwKaKPlqyKCdCzSNug3spJUNhP7Z1N=w200',
    'Deniele Matanguihan': 'https://lh3.googleusercontent.com/d/1UBHzv_WdnPiyKAlKUjoDwdV9ccS7k6T-=w200',
    'Dyan Lim':            'https://lh3.googleusercontent.com/d/1RRpX0zS5Yd9L3ZLoS-pJwfL15dMoSgmR=w200',
    'Francis Pineda':      'https://lh3.googleusercontent.com/d/1IAzDs1IoUound63RGbxkk9vYDPYu257L=w200',
    'JD Flores':           'https://lh3.googleusercontent.com/d/1y_h5fFW864BznOlxwlA8RGJUgnW1H3ff=w200',
    'Loren Kate Capitle':  'https://lh3.googleusercontent.com/d/1dUhiS3jkfyUi9VD2uc90MsMhKuhd4_hy=w200',
    'Roy Guzman':          'https://lh3.googleusercontent.com/d/19NPGZH5P0DupAWjmfcJKU64ZnqHBA3Sc=w200',
    'Gerard Precioso':     'https://lh3.googleusercontent.com/d/1R0i6qjTaaSD6T5HEYROr8SNfbFcd7qov=w200',
    'Andrea Reyes':        'https://lh3.googleusercontent.com/d/1WCKfr3F-MnjV_AN_ab-CaR8qOtlGsEyl=w200',
    'Sherry-an Respicio':  'https://lh3.googleusercontent.com/d/1J2L_CzMmgZ-H4RcGSPcrlLvR9gZuWg6I=w200',
    'Nikki Lumactod':      'https://lh3.googleusercontent.com/d/1pfZJOfGWRlsoDcaGn9i1kOmvvr6N-yVo=w200',
  }
};
</script>

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body,#app{height:100%}
body{margin:0;font-family:var(--font);font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:600}
h1{font-size:1.35rem;letter-spacing:-.01em} h2{font-size:1.08rem} h3{font-size:.98rem}
p{margin:.3rem 0}
.num,td.num,.tabular{font-variant-numeric:tabular-nums}

.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:var(--radius-m)}
.skip:focus{left:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.brand-name{font-weight:600;color:#fff;line-height:1.15}
.brand-name small{display:block;font-weight:400;color:#9FB0C8;font-size:12px}
.nav{list-style:none;margin:0;padding:10px 8px;overflow:auto;flex:1}
.nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:0;color:inherit;padding:9px 10px;border-radius:var(--radius-m);cursor:pointer;text-align:left;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-800);color:#fff;box-shadow:inset 3px 0 0 #7FA8E3}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .badge-count{margin-left:auto;background:#A3382A;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:600}
.collapsed .nav-label,.collapsed .brand-name,.collapsed .badge-count,.collapsed .side-foot span{display:none}
.collapsed .nav button{justify-content:center}
.side-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9FB0C8;display:flex;gap:8px;align-items:center}
.side-foot button{background:none;border:0;color:#C8D3E3;cursor:pointer;padding:6px;border-radius:6px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{margin-right:auto;white-space:nowrap}
.icon-btn.menu-btn{display:none}
.content{padding:20px;overflow:auto;flex:1;min-height:0}
.content-inner{max-width:1440px;margin:0 auto}
.demo-banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);padding:6px 20px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-banner strong{font-weight:600}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:var(--radius-m);cursor:pointer;font-weight:500;font-size:13.5px;line-height:1.3;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#0B1526}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0B1526}}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-ghost{background:none;border-color:transparent}
.btn-ghost:hover{background:var(--neutral-soft);border-color:transparent}
.btn-sm{padding:4px 9px;min-height:28px;font-size:12.5px}
.icon-btn{border:0;background:none;padding:7px;border-radius:var(--radius-m);cursor:pointer;color:var(--ink-2);display:inline-grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--neutral-soft)}
.icon-btn svg{width:19px;height:19px}
.dot-count{position:absolute;top:1px;right:0;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 4px;min-width:16px;line-height:16px;text-align:center}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:7px 10px;min-height:34px;width:100%;color:var(--ink)}
textarea.input{min-height:76px;resize:vertical;line-height:1.45}
.input:focus{border-color:var(--accent);box-shadow:var(--focus);outline:none}
.input[aria-invalid="true"]{border-color:var(--bad)}
.input-sm{min-height:30px;padding:4px 8px;font-size:13px}
.topbar .input{width:auto;min-width:150px}
.search{position:relative}
.search .input{padding-left:30px;min-width:220px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:40}
.search-results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.search-results button:hover,.search-results button.active{background:var(--accent-soft)}
.search-results small{color:var(--muted);display:block}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.req::after{content:" *";color:var(--bad)}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.err{font-size:12.5px;color:var(--bad);margin-top:4px;display:flex;gap:4px}
.err::before{content:"!";font-weight:700;border:1.5px solid currentColor;border-radius:50%;width:15px;height:15px;font-size:10px;display:inline-grid;place-items:center;flex:none;margin-top:2px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid .span2{grid-column:span 2} .fgrid .span3{grid-column:1/-1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.radio-row{display:flex;flex-wrap:wrap;gap:8px}
.radio-pill{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:6px 11px;border-radius:var(--radius-m);cursor:pointer;font-size:13.5px}
.radio-pill:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-pill input{accent-color:var(--accent)}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h h2{margin-right:auto}
.panel-h .sub{color:var(--muted);font-size:12.5px;width:100%;margin-top:-4px}
.panel-b{padding:14px 16px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)} .small{font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px}
.filters .f{display:flex;flex-direction:column;gap:3px}
.filters .f label{font-size:11.5px;font-weight:600;color:var(--muted)}
.filters .input{min-width:140px;width:auto}
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin:2px 0 0;max-width:70ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--surface-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:var(--radius-m);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}

/* ---------- KPI strip ---------- */
.kpi-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.kpi{border:0;background:none;text-align:left;padding:14px 16px 13px;cursor:pointer;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--surface-2)}
.kpi .k-label{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .k-value{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k-sub{font-size:12px;color:var(--muted)}
.kpi.alert .k-value{color:var(--bad)}
.kpi.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad)}
.kpi.caution::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
table.t th button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t td.num,table.t th.num{text-align:right}
table.t .group-h th{background:var(--surface);border-bottom:0;font-size:11.5px;color:var(--muted);padding-bottom:0}
.t-title{font-weight:500}
.t-sub{color:var(--muted);font-size:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;font-size:13px;color:var(--muted)}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--neutral-soft);color:var(--ink-2);line-height:1.5}
.b::before{content:"";width:7px;height:7px;flex:none;background:currentColor}
.b.ok{background:var(--ok-soft);color:var(--ok)} .b.ok::before{border-radius:50%}
.b.warn{background:var(--warn-soft);color:var(--warn)} .b.warn::before{transform:rotate(45deg);width:6px;height:6px}
.b.bad{background:var(--bad-soft);color:var(--bad)} .b.bad::before{clip-path:polygon(50% 0,100% 100%,0 100%);width:8px;height:8px}
.b.info{background:var(--info-soft);color:var(--info)} .b.info::before{border-radius:50%;background:none;border:2px solid currentColor;width:8px;height:8px}
.b.plain::before{display:none}
.b.syn{background:var(--warn-soft);color:var(--warn)} .b.syn::before{display:none}

/* ---------- sync pill ---------- */
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 9px;font-size:12.5px;background:var(--surface);cursor:pointer;color:var(--ink-2);white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.sync[data-state="syncing"] i{background:var(--info);animation:pulse 1s infinite}
.sync[data-state="pending"] i{background:var(--warn);border-radius:1px;transform:rotate(45deg)}
.sync[data-state="failed"] i,.sync[data-state="conflict"] i{background:var(--bad);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.sync[data-state="offline"] i{background:var(--muted)}
@keyframes pulse{50%{opacity:.35}}
.user-chip{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:3px 6px;border-radius:var(--radius-m);text-align:left}
.user-chip:hover{background:var(--neutral-soft)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar{position:relative;overflow:hidden;width:30px;height:30px;border-radius:50%;background:var(--navy-600);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.user-chip .u-name{font-size:13px;font-weight:600;line-height:1.1;display:block}
.user-chip .u-role{font-size:11.5px;color:var(--muted)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow);min-width:260px;z-index:50;padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--neutral-soft)}
.menu .menu-h{padding:8px 10px;border-bottom:1px solid var(--line-2);margin-bottom:4px;font-size:12.5px;color:var(--muted)}
.rel{position:relative}

/* ---------- priority ledger ---------- */
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;border-bottom:1px solid var(--line-2)}
.ledger li:last-child{border-bottom:0}
.ledger .rail{background:var(--line)}
.ledger li[data-sev="High"] .rail{background:var(--bad)}
.ledger li[data-sev="Medium"] .rail{background:var(--warn)}
.ledger li[data-sev="Low"] .rail{background:var(--info)}
.ledger .l-body{padding:9px 0;min-width:0}
.ledger .l-type{font-weight:600;font-size:13.5px}
.ledger .l-meta{font-size:12.5px;color:var(--muted)}
.ledger .l-act{align-self:center;padding-right:12px}
.sev{font-size:11px;font-weight:700;margin-right:6px;color:var(--muted)}
.ledger li[data-sev="High"] .sev{color:var(--bad)}
.ledger li[data-sev="Medium"] .sev{color:var(--warn)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid-line{stroke:var(--line-2)}
.chart .bar{fill:var(--accent);cursor:pointer}
.chart .bar:hover,.chart .bar:focus{fill:var(--accent-strong);outline:none}
.chart .bar2{fill:var(--navy-600);opacity:.35;pointer-events:none}
:root[data-theme="dark"] .chart .bar2{fill:#9BB6DD}
.chart .line{fill:none;stroke:var(--ok);stroke-width:2}
.chart .pt{fill:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:2px}
.hbars{display:flex;flex-direction:column;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(110px,38%) 1fr 44px;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:13px}
.hbar:hover{background:var(--surface-2)}
.hbar .track{height:10px;background:var(--neutral-soft);border-radius:5px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--neutral-soft);margin:6px 0 12px}
.segbar span{display:block;height:100%}
.fu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fu-cell{border:1px solid var(--line-2);border-radius:var(--radius-m);padding:8px 10px;background:none;text-align:left;cursor:pointer}
.fu-cell:hover{border-color:var(--muted)}
.fu-cell b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.fu-cell small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.fu-cell small i{width:9px;height:9px;display:inline-block;border-radius:2px}
.minibar{height:6px;background:var(--neutral-soft);border-radius:3px;overflow:hidden;min-width:60px}
.minibar span{display:block;height:100%;background:var(--accent)}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(9,18,32,.48);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px calc(4vh + env(safe-area-inset-bottom,0px));z-index:60;overflow:auto}
.modal{background:var(--surface);border-radius:var(--radius-l);box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:640px;display:flex;flex-direction:column;max-height:none;border:1px solid var(--line)}
.modal.lg{max-width:980px} .modal.xl{max-width:1180px}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal-h h2{font-size:1.12rem;margin-right:auto}
.modal-h .sub{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 var(--radius-l) var(--radius-l)}
.modal-f .left{margin-right:auto;color:var(--muted);font-size:12.5px}

/* ---------- coaching form ---------- */
.form-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px}
.steps{list-style:none;margin:0;padding:0;position:sticky;top:0;align-self:start;counter-reset:step}
.steps button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--radius-m);cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.steps button::before{counter-increment:step;content:counter(step);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.steps button[aria-current="step"]::before{border-color:var(--accent);background:var(--accent);color:#fff}
.steps button.has-err::after{content:"needs attention";margin-left:auto;font-size:10.5px;color:var(--bad);font-weight:600}
.fsec{display:none} .fsec.on{display:block}
.fsec h3{margin-bottom:4px} .fsec .sec-intro{color:var(--muted);font-size:13px;margin-bottom:14px}
.csec{border-top:1px solid var(--line-2);padding-top:16px;margin-top:18px}
.csec:first-of-type{border-top:0;padding-top:0;margin-top:4px}
.csec > h3{margin-bottom:12px}
.item-row.simple{grid-template-columns:minmax(0,1fr) 160px 140px 84px}
.item-row.simple.nostatus{grid-template-columns:minmax(0,1fr) 160px 84px}
.item-row.item-head{background:none;border:0;padding:0 8px;font-size:11.5px;font-weight:600;color:var(--muted);margin:4px 0 2px}
.items-list{display:flex;flex-direction:column;gap:8px}
.item-row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) 150px 140px auto;gap:8px;align-items:start;border:1px solid var(--line-2);border-radius:var(--radius-m);padding:8px;background:var(--surface-2)}
.calc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--radius-m);padding:9px 12px;font-size:13px}

/* ---------- detail ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted);font-weight:600}
.dl dd{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dl .wide{grid-column:1/-1}
.sec{border-top:1px solid var(--line-2);padding-top:14px;margin-top:14px}
.sec > h3{margin-bottom:8px}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 12px 16px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .cnt{display:inline-block;margin-left:5px;background:var(--neutral-soft);border-radius:9px;padding:0 6px;font-size:11.5px;font-variant-numeric:tabular-nums}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px;font-weight:600}
.loading{padding:40px;text-align:center;color:var(--muted)}
.spinner{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.profile-head{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.profile-head .avatar{width:52px;height:52px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--radius-m);overflow:hidden}
.stats div{background:var(--surface);padding:10px 12px}
.stats b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.alert-card{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--radius-m);padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.alert-card.reviewed{border-left-color:var(--ok);opacity:.85}
.def-list dt{font-weight:600;margin-top:10px}
.def-list dd{margin:2px 0 0;color:var(--ink-2)}
.def-list code{font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* ---------- toast ---------- */
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--navy-900);color:#fff;padding:11px 14px;border-radius:var(--radius-m);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid #7FA8E3}

/* ---------- QA scorecard form ---------- */
.audit-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}

.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto 56px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line-2)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.wk small{font-size:12px;color:var(--muted);font-weight:600}
.wk.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wk.today small{color:var(--accent)}
@media (max-width:900px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}

.rost-wrap table.t td,.rost-wrap table.t th{white-space:nowrap}
.rost-wrap table.t td{padding-left:8px;padding-right:8px}
.rost-wrap .sch{padding:2px 7px}

<body>

<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var CFG = window.AGS_CONFIG;
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MON3 = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, sept:8, oct:9, nov:10, dec:11 };

  // ---------------- tiny helpers (same patterns as the hubs) ----------------
  var LS = (function () { try { var k = '__t'; localStorage.setItem(k, k); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
  function lsGet(k, fb) { if (!LS) return fb; try { var v = LS.getItem(k); return v === null ? fb : JSON.parse(v); } catch (e) { return fb; } }
  function lsSet(k, v) { if (!LS) return false; try { LS.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var pad2 = function (n) { return String(n).padStart(2, '0'); };
  function dayKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function keyDate(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(k, n) { var d = keyDate(k); d.setDate(d.getDate() + n); return dayKey(d); }
  function fmtDay(k, y) { return keyDate(k).toLocaleDateString('en-US', y ? { month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' }); }
  function fmtDow(k) { return keyDate(k).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function fmtRange(a, b) { if (a === b) return fmtDay(a, true); return fmtDay(a, a.slice(0, 4) !== b.slice(0, 4)) + ' – ' + fmtDay(b, true); }
  function monthKey(k) { return k.slice(0, 7); }
  function monthLabel(m) { return MONTHS[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4); }

  // durations
  function hms(s) { if (s == null || isNaN(s)) return '—'; var neg = s < 0; s = Math.abs(Math.round(s)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (neg ? '−' : '') + h + ':' + pad2(m) + ':' + pad2(x); }
  function msf(s) { if (s == null || isNaN(s)) return '—'; s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); }
  function pct(x, d) { return x == null || !isFinite(x) ? '—' : (x * 100).toFixed(d == null ? 1 : d) + '%'; }
  function int(n) { return n == null ? '—' : Math.round(n).toLocaleString(); }
  function div(a, b) { return a == null || b == null || !b ? null : a / b; }
  function parseDur(v) {
    if (v == null) return 0; var s = String(v).trim(); if (!s) return 0;
    if (/^-?\d+(\.\d+)?$/.test(s)) return Math.round(parseFloat(s));
    var p = s.split(':').map(function (x) { return parseFloat(x) || 0; });
    if (p.length === 3) return Math.round(p[0] * 3600 + p[1] * 60 + p[2]);
    if (p.length === 2) return Math.round(p[0] * 60 + p[1]);
    return Math.round(p[0] || 0);
  }

  // ---------------- icons (the hubs' set, plus a few) ----------------
  var I = {
    dashboard: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
    sessions: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    followups: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
    calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
    agents: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5"/>',
    reports: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
    close: '<path d="M18 6L6 18M6 6l12 12"/>', menu: '<path d="M3 6h18M3 12h18M3 18h18"/>', chev: '<path d="M15 18l-6-6 6-6"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
    alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
    sheet: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>'
  };
  function icon(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[n] + '</svg>'; }
  function toast(msg, kind, ms) {

    el.innerHTML = '<div>' + esc(msg) + '</div><button aria-label="Dismiss">×</button>';
    el.querySelector('button').onclick = function () { el.remove(); };
    $('#toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, ms || (kind === 'bad' ? 9000 : 4500));
  }
  function infoTip(text) { return '<button class="info" type="button" data-tip="' + esc(text) + '" aria-label="' + esc(text.replace(/\n/g, '. ')) + '">i</button>'; }

    var tip = null;

  // ---------------- theme: Auto (dark at night in Manila), Light, Dark — as in the hubs ----------------
  function manilaHour() { try { return +new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Manila', hour: '2-digit', hour12: false }).format(new Date()) % 24; } catch (e) { return new Date().getHours(); } }
  function themeMode() { return lsGet('ags_theme_mode', 'auto'); }
  function applyTheme() {
    var m = themeMode(), h = manilaHour(), dark = m === 'dark' || (m === 'auto' && (h >= 18 || h < 6));
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var b = $('#theme-btn'); if (b) { b.innerHTML = dark ? '☾' : '☀'; b.title = 'Theme: ' + ({ auto: 'Auto (dark at night in Manila)', light: 'Light', dark: 'Dark' })[m] + '. Click to change.'; b.setAttribute('aria-label', b.title); }
  }

  // ---------------- photos and avatars ----------------
  function initials(n) { return String(n || '?').split(/\s+/).map(function (x) { return x[0] || ''; }).join('').toUpperCase().slice(0, 2); }
  function av(name, cls) { var p = CFG.AGENT_PHOTOS[name]; return '<span class="av' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + esc(initials(name)) + (p ? '<img src="' + esc(p) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + '</span>'; }
  function who(name) { return '<span class="who">' + av(name) + '<span>' + esc(name) + '</span></span>'; }

  // ---------------- state ----------------
  var S = {
    rows: [], agents: [], loaded: false, loading: false, error: '', notes: [], syncedAt: null, has: {}, shiftReady: false,
    page: 'overview', period: lsGet('ags_cr_period', 'thismonth'), from: null, to: null, shift: lsGet('ags_cr_shift', 'all'),
    agent: null, timeView: 'avg', excludeFlagged: lsGet('ags_cr_exclude', true), checkCode: 'all', logAgent: 'all', logShort: false, logPage: 0, navCollapsed: lsGet('ags_nav_collapsed', false),
    sort: { lb: { k: 'calls', d: -1 }, roster: { k: 'calls', d: -1 }, time: { k: 'login', d: -1 }, day: { k: 'date', d: -1 }, log: { k: 'date', d: -1 }, month: { k: 'month', d: -1 }, checks: { k: 'date', d: -1 }, rost: { k: 'name', d: 1 } },
    roster: [], rosterOk: false, rosterErr: '',
    minKey: null, maxKey: null
  };
  var NAV = [['overview', 'Overview', 'dashboard'], ['agents', 'Agents', 'agents'], ['roster', 'Roster', 'calendar'], ['time', 'Time breakdown', 'followups'], ['log', 'Daily log', 'sessions'], ['checks', 'Data checks', 'alert'], ['guide', 'How it’s calculated', 'reports']];
  var TITLES = { overview: 'Overview', agents: 'Agents', roster: 'Roster', time: 'Time breakdown', log: 'Daily log', checks: 'Data checks', guide: 'How it’s calculated' };

  // ---------------- reading the Google Sheet (keyless gviz feed) ----------------
  var FIELDS = {
    date: ['date'], name: ['user name', 'username', 'agent', 'agent name', 'name'],
    inbound: ['inbound calls'], inTime: ['inbound minutes', 'inbound time'], outbound: ['outbound calls'], outTime: ['outbound minutes', 'outbound time'],
    talk: ['talk time'], hold: ['hold time'], online: ['online', 'online time'], session: ['session time'], login: ['login time'],
    wrap: ['wrap-up total', 'wrapup total', 'wrap up total'], wrapCount: ['wrap-up count', 'wrapup count'], offered: ['offered calls'], missed: ['missed dials', 'missed calls'], ahtSheet: ['aht', 'average handle time', 'avg handle time'], meeting: ['meeting total'], brk: ['unscheduled break total']
  };
  var TIME_FIELDS = { ahtSheet: 1, inTime: 1, outTime: 1, talk: 1, hold: 1, online: 1, session: 1, login: 1, wrap: 1, meeting: 1, brk: 1 };
  var NEEDED = { login: 'Login time', session: 'Session time', online: 'Online', wrap: 'Wrap-up total', offered: 'Offered calls' };
  function normH(s) { return String(s || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  function gvizUrl(sheet, q) { return 'https://docs.google.com/spreadsheets/d/' + CFG.SHEET_ID + '/gviz/tq?tqx=out:json&headers=1&sheet=' + encodeURIComponent(sheet) + '&tq=' + encodeURIComponent(q); }
  function fetchGviz(sheet, q) {
    return fetch(gvizUrl(sheet, q)).then(function (res) {
      if (!res.ok) throw new Error('the “' + sheet + '” tab returned ' + res.status + '. Check the sheet is shared as “Anyone with the link can view”');
      return res.text();
    }).then(function (text) {
      var data = null; try { data = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1)); } catch (e) { data = null; }
      if (!data) throw new Error('the sheet couldn’t be read. Check it’s shared as “Anyone with the link can view”');
      if (data.status === 'error') { var er = (data.errors && data.errors[0]) || {}; throw new Error('the “' + sheet + '” tab couldn’t be read (' + (er.detailed_message || er.message || 'query error') + ')'); }
      return data.table || { cols: [], rows: [] };
    });
  }
  function gDate(v) {
    if (v == null) return null; var s = String(v).trim(); if (!s) return null;
    var m = s.match(/^Date\((\d+),(\d+),(\d+)/); if (m) return new Date(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if (m) { var a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000; if (a > 12 && b <= 12) { var t = a; a = b; b = t; } return new Date(y, a - 1, b); }
    // "11-Jan" or "Jan 11" with no year: the latest such date that isn't in the future
    m = s.match(/^(\d{1,2})[\s-]([A-Za-z]{3,})\.?$/) || s.match(/^([A-Za-z]{3,})\.?[\s-](\d{1,2})$/);
    if (m) { var day = /^\d/.test(m[1]) ? +m[1] : +m[2], mon = MON3[(/^\d/.test(m[1]) ? m[2] : m[1]).toLowerCase().slice(0, 4)]; if (mon == null) mon = MON3[(/^\d/.test(m[1]) ? m[2] : m[1]).toLowerCase().slice(0, 3)]; if (mon == null) return null; var now = new Date(), d = new Date(now.getFullYear(), mon, day); if (d > now) d.setFullYear(d.getFullYear() - 1); return d; }
    return null;
  }
  function cSecs(c) {
    if (!c) return 0;
    if (typeof c.f === 'string' && c.f.indexOf(':') >= 0) return parseDur(c.f);
    var v = c.v; if (v == null || v === '') return 0;
    if (Array.isArray(v)) return (v[0] || 0) * 3600 + (v[1] || 0) * 60 + (v[2] || 0);
    if (typeof v === 'number') return v > 0 && v < 1 && !Number.isInteger(v) ? Math.round(v * 86400) : Math.round(v);
    var m = String(v).match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
    if (m) { var base = Date.UTC(1899, 11, 30), d = Date.UTC(+m[1], +m[2], +m[3]); return Math.round((d - base) / 1000) + (+m[4] || 0) * 3600 + (+m[5] || 0) * 60 + (+m[6] || 0); }
    return parseDur(v);
  }
  function cNum(c) { if (!c || c.v == null) return 0; return typeof c.v === 'number' ? Math.round(c.v) : parseInt(String(c.v).replace(/[, ]/g, ''), 10) || 0; }
  function cText(c) { return c && c.v != null ? String(c.f != null && typeof c.v !== 'string' ? c.f : c.v).trim() : ''; }

  // columns: a pinned letter wins when that column exists; otherwise the header name decides
  function mapColumns(cols) {
    var idx = {}, byLetter = {};
    cols.forEach(function (c, i) { byLetter[c.id] = i; });
    Object.keys(FIELDS).forEach(function (f) {
      var pin = CFG.COLUMN_PINS[f]; if (pin && byLetter[pin] != null) { idx[f] = byLetter[pin]; return; }
      var names = FIELDS[f], hit = -1;
      cols.forEach(function (c, i) { if (hit < 0 && names.indexOf(normH(c.label)) >= 0) hit = i; });
      if (hit < 0) cols.forEach(function (c, i) { var h = normH(c.label); if (hit < 0 && h && names.some(function (n) { return h.indexOf(n) === 0; })) hit = i; });
      if (hit >= 0) idx[f] = hit;
    });
    return idx;
  }

  // shifts (Consolidated tab), names matched as in the dashboard
  var nameTokens = function (s) { return String(s || '').toLowerCase().replace(/[^a-z\s'-]/g, ' ').split(/[\s-]+/).filter(Boolean); };
  function matchName(raw, known) {
    raw = String(raw || '').trim(); if (known.indexOf(raw) >= 0) return raw;
    var last, given;
    if (raw.indexOf(',') >= 0) { var i = raw.indexOf(','); last = raw.slice(0, i).trim(); given = raw.slice(i + 1).trim(); }
    else { var p = raw.split(/\s+/); last = p.pop() || ''; given = p.join(' '); }
    var lastT = nameTokens(last), givenT = nameTokens(given);
    var cands = known.filter(function (k) { var t = nameTokens(k); return lastT.length && lastT.every(function (x) { return t.indexOf(x) >= 0; }); });
    var byGiven = cands.filter(function (k) { return nameTokens(k).some(function (x) { return givenT.indexOf(x) >= 0; }); });
    if (byGiven.length === 1) return byGiven[0];
    if (!byGiven.length && cands.length === 1) return cands[0];
    return raw;
  }
  function estShift(v) {
    var s = String(v || '').toLowerCase().replace(/\s+/g, ''); if (!s) return '';
    var m = s.match(/^(\d{1,2})(?::\d{2})?(am|pm)/);
    if (m) { var h = (+m[1] % 12) + (m[2] === 'pm' ? 12 : 0); return h >= 6 && h < 18 ? 'DAY' : 'NIGHT'; }
    if (/day|morning/.test(s)) return 'DAY'; if (/night|mid|grave/.test(s)) return 'NIGHT'; return '';
  }
  function monthOfCell(c) {
    if (!c || (c.v == null && !c.f)) return '';
    var v = c.v;
    if (typeof v === 'string' && /^Date\(/.test(v)) { var d = gDate(v); return d ? d.getFullYear() + '-' + pad2(d.getMonth() + 1) : ''; }
    var t = String(c.f || v || ''), w = (t.match(/[A-Za-z]+/) || [''])[0].toLowerCase(), mo = MON3[w.slice(0, 4)] != null ? MON3[w.slice(0, 4)] : MON3[w.slice(0, 3)];
    if (mo == null) return '';
    var y = (t.match(/(?:19|20)\d{2}/) || [null])[0]; if (!y) { var n = new Date(); y = mo > n.getMonth() ? n.getFullYear() - 1 : n.getFullYear(); }
    return y + '-' + pad2(mo + 1);
  }
  var SHIFT_LABEL = { all: 'All shifts', DAY: '9AM – 6PM EST', NIGHT: '12AM – 9AM EST' };

  function load(silent) {
    if (S.loading) return;
    if (!CFG.SHEET_ID) { S.error = 'This hub isn’t linked to a sheet yet. Paste the Google Sheet ID into SHEET_ID in the configuration block at the top of the file.'; render(); return; }
    S.loading = true; paintSync();
    var shiftErr = '';
    Promise.all([
      fetchGviz(CFG.REPORT_TAB, 'select *'),
      CFG.SHIFT_TAB ? fetchGviz(CFG.SHIFT_TAB, 'select ' + CFG.SHIFT_COLS.month + ', ' + CFG.SHIFT_COLS.name + ', ' + CFG.SHIFT_COLS.shift + ' where ' + CFG.SHIFT_COLS.name + ' is not null').catch(function (e) { shiftErr = e.message; return null; }) : Promise.resolve(null),
      CFG.ROSTER_TAB ? fetchGviz(CFG.ROSTER_TAB, 'select A, B, C, D, E, F, G, H, I where A is not null').catch(function (e) { S.rosterErr = e.message; return null; }) : Promise.resolve(null)
    ]).then(function (res) {
      var t = res[0], idx = mapColumns(t.cols || []), notes = [];
      if (idx.date == null || idx.name == null) throw new Error('the “' + CFG.REPORT_TAB + '” tab has no Date or User name column');
      S.has = {}; Object.keys(FIELDS).forEach(function (f) { S.has[f] = idx[f] != null; });
      var miss = Object.keys(NEEDED).filter(function (f) { return !S.has[f]; }).map(function (f) { return NEEDED[f]; });
      if (miss.length) notes.push('These columns weren’t found in the “' + CFG.REPORT_TAB + '” tab, so the numbers that need them show “—”: ' + miss.join(', ') + '. Check the header names in row 1, or pin the column letters in COLUMN_PINS.');
      if (!S.has.ahtSheet) notes.push('The AHT column (' + (CFG.COLUMN_PINS.ahtSheet ? 'column ' + CFG.COLUMN_PINS.ahtSheet + ' of ' : '') + 'the “' + CFG.REPORT_TAB + '” tab) wasn’t found, so AHT is calculated as (talk time + hold time) ÷ calls instead.');
      var rows = [];
      (t.rows || []).forEach(function (r) {
        var c = r.c || [], cell = function (f) { return idx[f] == null ? null : c[idx[f]]; };
        var dc = cell('date'), d = dc ? gDate(typeof dc.v === 'string' || typeof dc.v === 'number' ? (typeof dc.v === 'number' ? dc.f : dc.v) : dc.f) || gDate(dc.f) : null;
        var name = cText(cell('name')); if (!d || !name) return;
        var o = { key: dayKey(d), name: name, shift: '' };
        Object.keys(FIELDS).forEach(function (f) { if (f === 'date' || f === 'name') return; o[f] = S.has[f] ? (TIME_FIELDS[f] ? cSecs(cell(f)) : cNum(cell(f))) : null; });
        rows.push(o);
      });
      // shifts per agent per month (closest earlier month when a month is missing)
      var known = Array.from(new Set(rows.map(function (r) { return r.name; })));
      S.shiftReady = false;
      // the Roster: hire dates and the weekly schedule
      S.rosterOk = !!res[2]; S.roster = res[2] ? parseRoster(res[2], known) : [];
      if (CFG.ROSTER_TAB && !res[2]) notes.push('The “' + CFG.ROSTER_TAB + '” tab couldn’t be read (' + (S.rosterErr || 'no data') + '), so the Roster page is empty.');
      var rosterShift = {}; S.roster.forEach(function (a) { if (a.shift === 'DAY' || a.shift === 'NIGHT') rosterShift[a.name] = a.shift; });
      var list = {};
      if (res[1]) {
        var byMonth = {};
        (res[1].rows || []).forEach(function (r) { var c = r.c || [], nm = matchName(cText(c[1]), known), mo = monthOfCell(c[0]), sh = estShift(cText(c[2])); if (!nm || !mo || !sh) return; byMonth[nm + '|' + mo] = sh; (list[nm] = list[nm] || []).push({ m: mo, sh: sh }); });

    var st = S.loading ? 'syncing' : S.error ? 'failed' : S.loaded ? 'connected' : 'offline';
    p.dataset.state = st;
    p.querySelector('span').textContent = S.loading ? 'Syncing…' : S.error ? 'Sync failed' : S.syncedAt ? 'Synced ' + S.syncedAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'Not synced';
    p.title = (S.maxKey ? 'Data through ' + fmtDay(S.maxKey, true) + '. ' : '') + 'Refreshes every ' + Math.round(CFG.REFRESH_SECONDS / 60) + ' minutes. Click to sync now.';
  }
  function render() {
    if (!$('#page')) return;
    var page = PAGES[S.page] ? S.page : 'overview', act = document.activeElement, keepId = act && act.id && $('#app').contains(act) ? act.id : null;
    var cc = checkCount();
    $('#nav').innerHTML = NAV.map(function (n) { return '<li><button data-act="nav" data-page="' + n[0] + '"' + (n[0] === page ? ' aria-current="page"' : '') + ' title="' + n[1] + '">' + icon(n[2]) + '<span class="nav-label">' + n[1] + '</span>' + (n[0] === 'checks' && cc ? '<span class="nav-count" aria-label="' + cc + ' serious">' + cc + '</span>' : '') + '</button></li>'; }).join('');
    $('#page-title').textContent = page === 'agents' && S.agent ? S.agent : TITLES[page];
    $('#page-sub').textContent = CFG.CLIENT_NAME + (S.loaded ? ' · ' + scopeLabel() + (S.maxKey ? ' · data through ' + fmtDay(S.maxKey) : '') : '');
    document.title = (page === 'agents' && S.agent ? S.agent : TITLES[page]) + ' · AGS Call Report';
    paintFilters(); paintSync();
    try { $('#page').innerHTML = PAGES[page](); }
    catch (e) { console.error(e); $('#page').innerHTML = '<div class="note bad" role="alert">This page could not be displayed (' + esc(e.message) + '). Sync the data; if it continues, report it to an administrator.</div>'; }
    if (keepId) { var el = document.getElementById(keepId); if (el) el.focus(); }
  }
  function go(page, agent) {
    S.page = page; S.agent = page === 'agents' ? agent || null : null; S.logPage = 0;
    var h = '#' + page + (S.agent ? '/' + encodeURIComponent(S.agent) : '');
    if (location.hash !== h) { try { history.pushState(null, '', h); } catch (e) { location.hash = h; } }
    $('#shell') && $('#shell').classList.remove('nav-open');
    render(); var m = $('#main'); if (m) { m.scrollTop = 0; }
  }
  function fromHash() { var h = decodeURIComponent(location.hash.slice(1)), p = h.split('/'); S.page = PAGES[p[0]] ? p[0] : 'overview'; S.agent = S.page === 'agents' && p[1] ? p.slice(1).join('/') : null; }

  // ---------------- actions ----------------
  var ACT = {}, CHG = {};
  ACT.nav = function (el) { go(el.dataset.page); };
  ACT.openAgent = function (el) { go('agents', el.dataset.name); };
  ACT.backAgents = function () { go('agents'); };
  ACT.sync = function () { load(false); };
  ACT.openNav = function () { $('#shell').classList.add('nav-open'); var b = $('#nav button'); if (b) b.focus(); };
  ACT.toggleNav = function () { if (window.innerWidth <= 900) { $('#shell').classList.remove('nav-open'); return; } S.navCollapsed = !S.navCollapsed; lsSet('ags_nav_collapsed', S.navCollapsed); $('#shell').classList.toggle('collapsed', S.navCollapsed); };
  ACT.themeNext = function () { var n = { auto: 'light', light: 'dark', dark: 'auto' }[themeMode()]; lsSet('ags_theme_mode', n); applyTheme(); toast('Theme: ' + ({ auto: 'Auto (dark at night in Manila)', light: 'Light', dark: 'Dark' })[n] + '.', 'ok'); };
  ACT.sort = function (el) { var st = S.sort[el.dataset.t], k = el.dataset.k; if (st.k === k) st.d = -st.d; else { st.k = k; st.d = k === 'name' || k === 'date' && el.dataset.t === 'day' ? 1 : -1; } render(); };
  ACT.allTime = function () { S.period = 'all'; S.shift = 'all'; lsSet('ags_cr_period', 'all'); lsSet('ags_cr_shift', 'all'); resolvePeriod(); render(); };
  ACT.checkCode = function (el) { S.checkCode = el.dataset.v; render(); };
  ACT.timeView = function (el) { S.timeView = el.dataset.v; render(); };
  ACT.logPage = function (el) { S.logPage += +el.dataset.d; render(); var m = $('#main'); if (m) m.scrollTop = 0; };
  ACT.exportCsv = function () {
    var rows = logRows();
    var head = ['Date', 'Agent', 'Shift', 'Login time', 'Session time', 'Online', 'Talk time', 'Wrap-up total', 'Meetings', 'Other statuses', 'Work time', 'Data checks', 'Inbound calls', 'Outbound calls', 'Offered calls', 'Answer rate (%)', 'AHT', 'Utilization (%)', 'Occupancy (%)'];
    var q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [head.join(',')].concat(rows.map(function (r) { var x = dayObj(r), dv = x.d; return [r.key, r.name, SHIFT_LABEL[r.shift] || '', hms(r.login), hms(r.session), hms(r.online), hms(r.talk), hms(r.wrap), S.has.meeting ? hms(r.meeting) : '', hms(x.other), hms(dv.work), x.flags.map(function (f) { return f.label; }).join('; ') + (dv.excluded ? ' (left out)' : ''), r.inbound, r.outbound, r.offered == null ? '' : r.offered, x.answer == null ? '' : (x.answer * 100).toFixed(1), msf(x.aht), x.util == null ? '' : (x.util * 100).toFixed(1), x.occ == null ? '' : (x.occ * 100).toFixed(1)].map(q).join(','); }));
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'Call_Report_' + S.from + '_to_' + S.to + (S.logAgent !== 'all' ? '_' + S.logAgent.replace(/\s+/g, '_') : '') + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Exported ' + plural(rows.length, 'row') + '.', 'ok');
  };
  CHG.period = function (el) { S.period = el.value; lsSet('ags_cr_period', S.period); if (S.period === 'custom' && !lsGet('ags_cr_custom', null)) lsSet('ags_cr_custom', [S.from, S.to]); resolvePeriod(); S.logPage = 0; render(); };
  CHG.custom = function () { var f = $('#g-from').value, t = $('#g-to').value; if (!f || !t) return; if (f > t) { var x = f; f = t; t = x; } lsSet('ags_cr_custom', [f, t]); resolvePeriod(); S.logPage = 0; render(); };
  CHG.shift = function (el) { S.shift = el.value; lsSet('ags_cr_shift', S.shift); S.logPage = 0; render(); };
  CHG.pickAgent = function (el) { go('agents', el.value); };
  CHG.logAgent = function (el) { S.logAgent = el.value; S.logPage = 0; render(); };
  CHG.excl = function (el) { S.excludeFlagged = el.checked; lsSet('ags_cr_exclude', S.excludeFlagged); render(); toast(el.checked ? 'Days with serious data problems are left out of the time numbers.' : 'Days with serious data problems are included in the time numbers.', 'ok'); };
  CHG.logShort = function (el) { S.logShort = el.checked; S.logPage = 0; render(); };

  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act]'); if (!el || el.disabled) return;
    if (el.classList.contains('info')) return;
    var f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
    var sh = $('#shell'); if (sh && sh.classList.contains('nav-open') && !e.target.closest('#sidebar') && !e.target.closest('[data-act="openNav"]')) sh.classList.remove('nav-open');
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act]')) { e.preventDefault(); ACT[e.target.dataset.act](e.target, e); }
    if (e.key === 'Escape') { var sh = $('#shell'); if (sh) sh.classList.remove('nav-open'); }
  });
  document.addEventListener('change', function (e) { var el = e.target.closest && e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
  window.addEventListener('popstate', function () { fromHash(); render(); });
  window.addEventListener('hashchange', function () { fromHash(); render(); });

  // ---------------- start ----------------
  fromHash(); renderShell(); render(); load(true);
  setInterval(function () { if (!document.hidden) load(true); }, CFG.REFRESH_SECONDS * 1000);
  setInterval(applyTheme, 60000);
})();

</script>
</body>
</html>
